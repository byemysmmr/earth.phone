<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>R.S.</title>
<style>
:root{
  --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;
  --sep:rgba(84,84,88,.6);
  --l1:#fff;--l2:rgba(235,235,245,.6);--l3:rgba(235,235,245,.3);
  --fill:rgba(118,118,128,.24);
  --tint:#d2b88e;--blue:#3d7fd9;--red:#ff453a;--green:#30d158;--orange:#ff9f0a;--yellow:#f2c230;--pink:#fa5a6e;
  --sbh:54px;--nbh:44px;--hi:34px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#0b0b0c radial-gradient(110% 70% at 50% 0%,#1d1d1f 0%,#0b0b0c 70%);color:var(--l1);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:manipulation;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;text-align:left;letter-spacing:inherit}
input{font:inherit;color:inherit;border:0;outline:0;background:none;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;letter-spacing:inherit}
[data-action]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
.tap{transition:transform .16s ease,opacity .16s ease,background-color .16s ease,filter .16s ease}
.tap:active{opacity:.5}
.app.tap:active,.widget.tap:active,.alb.tap:active,.ph.tap:active,.hcard.tap:active{opacity:1;transform:scale(.93);filter:brightness(.75)}
.cell.tap:active,.mrow.tap:active{opacity:1;background-color:rgba(255,255,255,.1)}

/* ===== 하우징 ===== */
.device{position:relative;height:calc(100vh - 32px);max-height:890px;aspect-ratio:9/19.3;max-width:calc(100vw - 24px);padding:10px;border-radius:62px;
  background:
    radial-gradient(70px 70px at 0 0,rgba(146,146,142,.9),rgba(146,146,142,.45) 34px,transparent 70px),
    radial-gradient(60px 60px at 100% 0,rgba(146,146,142,.85),rgba(146,146,142,.4) 28px,transparent 60px),
    radial-gradient(76px 76px at 0 100%,rgba(146,146,142,.9),rgba(146,146,142,.45) 36px,transparent 76px),
    radial-gradient(56px 56px at 100% 100%,rgba(146,146,142,.85),rgba(146,146,142,.4) 26px,transparent 56px),
    linear-gradient(150deg,#c9b38d 0%,#b09a76 50%,#9e8869 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(255,255,255,.1),inset 0 -3px 8px rgba(0,0,0,.22),0 34px 80px rgba(0,0,0,.7)}
.device::before{content:"";position:absolute;left:-3px;top:21%;width:4px;height:12%;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#8f7a5c,#b29c78);pointer-events:none}
.device::after{content:"";position:absolute;right:-3px;top:27%;width:4px;height:9%;border-radius:0 3px 3px 0;background:linear-gradient(270deg,#8f7a5c,#b29c78);pointer-events:none}
@supports (height:100dvh){.device{height:calc(100dvh - 32px)}}
.phone{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#000;isolation:isolate;-webkit-user-select:none;user-select:none;box-shadow:0 0 0 2px #050505}
@media (max-width:520px),(max-height:560px){
  body{background:#000}
  .device{width:100vw;height:100vh;max-width:none;max-height:none;aspect-ratio:auto;padding:0;border-radius:0;background:none;box-shadow:none}
  .device::before,.device::after{display:none}
  .phone{border-radius:0;box-shadow:none}
}
@supports (height:100dvh){@media (max-width:520px),(max-height:560px){.device{height:100dvh}}}

/* ===== 장식 레이어 ===== */
.wall{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 55% at 50% 108%,rgba(84,124,186,.42),transparent 62%),linear-gradient(180deg,#06080b 0%,#0b1017 55%,#121c2b 100%)}
.scratch{position:absolute;inset:0;width:100%;height:100%;z-index:900;pointer-events:none;opacity:.035}
.scratch path{vector-effect:non-scaling-stroke}

/* ===== 상태 표시줄 + 다이내믹 아일랜드 ===== */
.sb{position:absolute;top:0;left:0;right:0;height:var(--sbh);z-index:700;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:2px 28px 0 34px;font-size:16px;font-weight:600;color:#fff}
.sb-l{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;min-width:70px}
.sb-l svg{width:15px;height:15px}
#sbMute.off{display:none}
.sb-r{display:flex;align-items:center;gap:6px}
.sig{display:flex;align-items:flex-end;gap:1.6px;height:11.5px}
.sig i{display:block;width:3.1px;background:#fff;border-radius:1px}
.sig i:nth-child(1){height:4.5px}.sig i:nth-child(2){height:6.8px}.sig i:nth-child(3){height:9px}.sig i:nth-child(4){height:11.5px;opacity:.32}
.net{font-size:11px;font-weight:600;letter-spacing:.02em}
.bat{position:relative;width:26px;height:12.5px;border-radius:4px;background:rgba(255,255,255,.36);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#000;margin-right:3px}
.bat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:46%;background:#fff;border-radius:4px 1px 1px 4px}
.bat::after{content:"";position:absolute;right:-3.5px;top:4px;width:1.8px;height:4.5px;border-radius:0 1px 1px 0;background:rgba(255,255,255,.4)}
.bat span{position:relative}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;border-radius:20px;background:#000;z-index:950;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:width .42s cubic-bezier(.3,1.25,.5,1),height .42s cubic-bezier(.3,1.25,.5,1),border-radius .42s}
.island.show{width:min(350px,calc(100% - 22px));height:68px;border-radius:30px}
.island .it{opacity:0;padding:0 20px;font-size:13.5px;line-height:1.4;color:#fff;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;transition:opacity .15s}
.island.show .it{opacity:1;transition:opacity .2s .16s}

/* ===== 홈 ===== */
.home{position:absolute;inset:0;z-index:1;padding-top:calc(var(--sbh) + 14px);display:flex;flex-direction:column}
.home.nudge{animation:nudge .32s ease}
@keyframes nudge{30%{transform:scale(.985)}65%{transform:scale(1.005)}}
.hwrap{padding:0 26px}
.widget{display:flex;align-items:center;justify-content:space-around;width:100%;height:162px;border-radius:24px;background:rgba(28,28,30,.62);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);padding:12px 8px}
.wclk{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.face{display:block;width:90px;height:90px}
.face svg{width:100%;height:100%}
.clk .fc{fill:#1c1c1e}
.clk .tk{stroke:rgba(255,255,255,.38);stroke-width:1.5;stroke-linecap:round}
.clk .tk3{stroke:#fff;stroke-width:2.5}
.clk .hh{stroke:#fff;stroke-width:4.4;stroke-linecap:round}
.clk .mnh{stroke:#fff;stroke-width:3;stroke-linecap:round}
.clk .sh{stroke:#ff9f0a;stroke-width:1.4;stroke-linecap:round}
.clk .cdot{fill:#ff9f0a}
.clk.mars .fc{fill:#2a2319}
.clk.mars .tk3{stroke:#e8d4ab}
.clk.mars .sh{stroke:#d2b88e}
.clk.mars .cdot{fill:#d2b88e}
.clk.icon .fc{fill:#fff}
.clk.icon .tk{stroke:rgba(0,0,0,.35)}
.clk.icon .tk3{stroke:#000}
.clk.icon .hh,.clk.icon .mnh{stroke:#000}
.wcl{font-size:13px;font-weight:600;margin-top:4px}
.wcs{font-size:11.5px;color:var(--l2);font-variant-numeric:tabular-nums;white-space:nowrap}
.wlabel{text-align:center;font-size:12px;color:#fff;margin:7px 0 20px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;min-height:44px}
.ico{position:relative;width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ico>svg{width:33px;height:33px}
.lbl{font-size:12px;color:#fff;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.45);letter-spacing:0}
.badge{position:absolute;top:-7px;right:-9px;min-width:23px;height:23px;padding:0 6px;border-radius:12px;background:#ff3b30;color:#fff;font-size:13.5px;font-weight:600;display:none;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.g-relay{background:linear-gradient(180deg,#748457,#414b30)}
.g-log{background:linear-gradient(180deg,#dcc8a0,#a88e64);color:#2b2418}
.g-msg{background:linear-gradient(180deg,#6ea0dc,#3767a6)}
.g-music{background:linear-gradient(180deg,#fd6d80,#e2344e)}
.g-photo{background:linear-gradient(180deg,#f8c75a,#ee8b33)}
.g-memo{background:linear-gradient(180deg,#f6cf4a 0,#f6cf4a 27%,#fbfbfb 27%,#efefef 100%)}
.g-cal{background:linear-gradient(180deg,#fff,#efefef);color:#000}
.g-clock{background:#0a0a0a;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.18)}
.g-web{background:linear-gradient(180deg,#62b3f8,#2068d6)}
.g-shop{background:linear-gradient(180deg,#f8af58,#e2741e)}
.g-video{background:linear-gradient(180deg,#3c3c3f,#151516)}
.g-set{background:linear-gradient(180deg,#a6a6ac,#6a6a70)}
.g-chess{background:linear-gradient(180deg,#a8835c,#6b5034)}
.mm{width:66%;display:flex;flex-direction:column;gap:6px;margin-top:16px}
.mm i{display:block;height:1.6px;background:#c7c7cc;border-radius:1px}
.cd{display:flex;flex-direction:column;align-items:center;line-height:1}
.cd b{font-size:10px;font-weight:600;color:#ff3b30;margin-top:2px}
.cd span{font-size:31px;font-weight:300;color:#000;margin-top:2px;letter-spacing:-.03em}
.ico .clk{width:54px;height:54px}
.gl{font-size:34px;line-height:1;color:#fff;font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans","Noto Sans Symbols 2",serif}
.fico{background:rgba(130,130,138,.36);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:stretch;justify-items:stretch;gap:4px;padding:9px;box-shadow:none}
.fico i{display:block;border-radius:3.5px}
.wallcap{text-align:center;font-size:10.5px;line-height:1.55;color:rgba(255,255,255,.32);padding:0 40px;margin-top:auto;margin-bottom:14px;pointer-events:none;word-break:keep-all}
.spot{align-self:center;display:flex;align-items:center;gap:5px;min-height:44px;padding:0 16px;margin-bottom:10px;border-radius:22px;font-size:13px;font-weight:600;color:#fff}
.spot>span{display:flex;align-items:center;gap:5px;height:30px;padding:0 13px;border-radius:15px;background:rgba(120,120,128,.36);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.spot svg{width:13px;height:13px;stroke-width:2.6}
.dock{flex:0 0 auto;height:94px;margin:0 12px calc(var(--hi) - 22px);border-radius:34px;background:rgba(120,120,128,.24);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);pointer-events:none}

/* ===== 폴더 ===== */
.scr.folder{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(34px) saturate(140%);backdrop-filter:blur(34px) saturate(140%);transform:none;opacity:0;align-items:center;justify-content:center;transition:opacity .3s ease,visibility 0s linear .3s}
.scr.folder.active{opacity:1;transition:opacity .3s ease,visibility 0s}
.fwrap{width:min(320px,86%);transform:scale(.6);transition:transform .4s cubic-bezier(.32,.72,0,1)}
.scr.folder.active .fwrap{transform:none}
.fname{font-size:30px;font-weight:700;margin:0 0 16px 8px;cursor:default}
.fpanel{border-radius:40px;background:rgba(80,80,86,.48);padding:24px 8px 20px;cursor:default}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:18px}

/* ===== 공통 화면 ===== */
.scr{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;transform:translateX(100%);visibility:hidden;pointer-events:none;box-shadow:-12px 0 40px rgba(0,0,0,.55);transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .32s ease,border-radius .4s,visibility 0s linear .4s}
.scr.active{transform:none;visibility:visible;pointer-events:auto;transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .32s ease,border-radius .4s,visibility 0s linear 0s}
.scr.zoom{transform:scale(.84);opacity:0;border-radius:44px;box-shadow:none}
.scr.zoom.active{transform:none;opacity:1;border-radius:0}
.scr.fade{transform:none;opacity:0;box-shadow:none}
.scr.fade.active{opacity:1}
.scr.active.behind{transform:translateX(-28%)}
.t-yellow{--tint:#f2c230}.t-red{--tint:#ff5a4f}.t-orange{--tint:#ff9f0a}.t-pink{--tint:#fa5a6e}.t-blue{--tint:#4c9bff}

.nb{position:absolute;top:0;left:0;right:0;z-index:5;height:calc(var(--sbh) + var(--nbh));padding:var(--sbh) 6px 0 4px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid transparent;transition:background-color .2s,border-color .2s}
.nb.solid,.scr.inl .nb{background:rgba(18,18,20,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nb-back{position:relative;z-index:1;display:flex;align-items:center;min-width:44px;height:44px;max-width:42%;padding:0 8px 0 0;color:var(--tint);font-size:17px;letter-spacing:-.02em}
.nb-back svg{flex:0 0 auto;width:26px;height:26px;stroke-width:2.5}
.nb-back .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:-2px}
.scr.root .nb-back{visibility:hidden}
.nb-t{position:absolute;left:50%;bottom:0;transform:translateX(-50%);max-width:54%;height:44px;line-height:44px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.nb.tshow .nb-t,.scr.inl .nb-t{opacity:1}
.nb-r{position:relative;z-index:1;display:flex;align-items:center}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sbh) + var(--nbh)) 0 18px;margin-bottom:44px}
.scr.has-tb .body,.scr.has-bb .body{margin-bottom:0}
.body{scroll-padding-top:calc(var(--sbh) + var(--nbh) + 8px);scroll-padding-bottom:16px}
.scr.has-tb .body{padding-bottom:22px;scroll-padding-bottom:12px}
.lt{font-size:34px;font-weight:700;line-height:41px;padding:0 16px 12px;letter-spacing:.005em}
.grp{margin:0 16px 26px;border-radius:12px;background:var(--bg2);overflow:hidden}
.gh{font-size:13px;color:var(--l2);padding:0 32px 7px;line-height:1.35}
.gh.big{font-size:22px;font-weight:700;color:var(--l1);padding:4px 16px 10px}
.gf{font-size:13px;color:var(--l2);padding:0 32px;margin:-18px 0 26px;line-height:1.45;word-break:keep-all}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;text-align:left;color:var(--l1)}
.cell+.cell::before{content:"";position:absolute;top:0;left:var(--sepl,16px);right:0;height:.5px;background:var(--sep);pointer-events:none}
.grp.s56{--sepl:56px}.grp.s60{--sepl:60px}.grp.s68{--sepl:68px}.grp.s44{--sepl:44px}
.cm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:11px 0;gap:2px}
.ct{display:block;font-size:17px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct b{font-weight:600}
.ct.miss{color:var(--red)}
.ct.tint{color:var(--tint)}
.ct.wrap{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.cs{display:block;font-size:14.5px;color:var(--l2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs.wrap{white-space:normal;word-break:keep-all}
.cr{flex:0 0 auto;max-width:62%;font-size:17px;color:var(--l2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr.sm{font-size:15px}
.cr.wrap{white-space:normal;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;padding:11px 0}
.chev{flex:0 0 auto;color:var(--l3);margin-right:-4px}
.chev svg{width:15px;height:15px;stroke-width:2.6}
.sq{flex:0 0 30px;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff}
.sq svg{width:18px;height:18px}
.av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#a5a5ab,#6c6c72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;letter-spacing:0;overflow:hidden}
.av svg{width:26px;height:26px}
.av.l{flex-basis:52px;width:52px;height:52px;font-size:20px}
.av.xl{flex-basis:100px;width:100px;height:100px;font-size:40px}
.av.xl svg{width:62px;height:62px}
.av.def{background:linear-gradient(180deg,#8e8e93,#5b5b60)}
.ib{flex:0 0 44px;width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--tint)}
.ib svg{width:23px;height:23px}
.capsule{flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;background:rgba(255,69,58,.18);color:var(--red)}
.seg{display:flex;margin:0 16px 18px;padding:2px;border-radius:11px;background:var(--fill)}
.seg button{flex:1;min-width:0;min-height:44px;border-radius:9px;font-size:14px;font-weight:500;text-align:center;color:var(--l1)}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.sf{display:flex;align-items:center;gap:6px;margin:0 16px 16px;min-height:40px;padding:0 0 0 10px;border-radius:11px;background:var(--fill);color:var(--l2)}
.sf svg{flex:0 0 18px;width:18px;height:18px}
.sf input{flex:1;min-width:0;height:40px;font-size:17px;color:var(--l1)}
.sf input::placeholder,.cf input::placeholder{color:var(--l2)}
.sfb{flex:0 0 auto;min-width:56px;height:44px;padding:0 12px;color:var(--tint);font-size:16px;font-weight:600;text-align:center}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 32px);margin:0 16px 26px;min-height:50px;border-radius:14px;background:var(--tint);color:#1b1710;font-size:17px;font-weight:600;text-align:center}
.wbtn.ghost{background:var(--bg2);color:var(--tint)}
.wbtn svg{width:20px;height:20px}
.foot{text-align:center;font-size:13px;color:var(--l2);padding:4px 20px 20px}
.tb{flex:0 0 auto;display:flex;justify-content:space-around;padding:4px 8px 42px;background:rgba(18,18,20,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);position:relative;z-index:5}
.tb button{flex:1;max-width:120px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8e8e93;font-size:10.5px;font-weight:500;text-align:center;letter-spacing:0}
.tb button svg{width:27px;height:27px}
.tb button.on{color:var(--tint)}
.sw{position:relative;display:block;width:51px;height:31px;border-radius:16px;background:#39393d;transition:background .22s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18),0 3px 1px rgba(0,0,0,.06);transition:transform .26s cubic-bezier(.3,.7,.4,1)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.swb{flex:0 0 auto;min-width:56px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}

/* ================= 화면 전환 (단일 스택) ================= */
var stack = [];
var lastParam = {};
var navLock = false, navTimer = 0;
var REFRESH = {msg:1, gallery:1, galbum:1, relay:1, music:1, malbum:1, web:1, shop:1, clock:1, video:1, cal:1, settings:1};
var R = {};

function lockNav(){ navLock = true; clearTimeout(navTimer); navTimer = setTimeout(function(){ navLock = false; }, 300); }
function restack(){ for(var i = 0; i < stack.length; i++){ var el = $('scr-' + stack[i]); if(el){ el.style.zIndex = String(10 + i * 2); } } }
function inStack(id){ return stack.indexOf(id) !== -1; }
function isLocked(){ var l = $('lock'); return !!(l && !l.classList.contains('hidden')); }
function setTitle(id, t){
  var el = $('scr-' + id); if(!el){ return; }
  el.setAttribute('data-title', t);
  var nt = el.querySelector('.nb-t'); if(nt){ nt.textContent = t; }
}
function resetNav(el){ var nb = el.querySelector('.nb'); if(nb){ nb.classList.remove('solid', 'tshow'); } }

function openScreen(id, param){
  if(navLock || isLocked()){ return false; }
  var el = $('scr-' + id);
  if(!el){ return false; }
  var at = stack.indexOf(id);
  if(at !== -1){
    /* 이미 열린 화면이면 그 화면까지 되돌아간다 (중복 스택 방지) */
    while(stack.length - 1 > at){
      var up = stack.pop(), uel = $('scr-' + up);
      if(uel){ uel.classList.remove('active', 'behind'); }
      leave(up);
    }
    el.classList.remove('behind');
    lastParam[id] = param;
    if(R[id]){ safe(function(){ R[id](param, false); }); }
    lockNav();
    safe(updateBadges);
    return true;
  }
  var prev = stack[stack.length - 1] || null;
  var fromRoot = !prev || prev === 'folder';
  lastParam[id] = param;
  if(!el.classList.contains('folder') && !el.classList.contains('fade')){ el.classList.toggle('zoom', fromRoot); }
  el.classList.toggle('root', fromRoot);
  var b = el.querySelector('.body'); if(b){ b.scrollTop = 0; }
  resetNav(el);
  var nt = el.querySelector('.nb-t'); if(nt){ nt.textContent = el.getAttribute('data-title') || ''; }
  if(R[id]){ safe(function(){ R[id](param, false); }); }
  var bl = el.querySelector('.bl');
  if(bl){
    var pt = prev && !fromRoot ? ($('scr-' + prev).getAttribute('data-title') || '') : '';
    bl.textContent = (pt && pt.length <= 9) ? pt : '뒤로';
  }
  if(prev && !fromRoot){ var pel = $('scr-' + prev); if(pel){ pel.classList.add('behind'); } }
  stack.push(id);
  restack();
  void el.offsetWidth;
  el.classList.add('active');
  lockNav();
  safe(updateBadges);
  return true;
}
function goBack(){
  if(isLocked() || navLock){ return; }
  var id = stack.pop();
  if(!id){ nudgeHome(); return; }
  var el = $('scr-' + id);
  if(el){ el.classList.remove('active', 'behind'); }
  leave(id);
  var top = stack[stack.length - 1];
  if(top){
    var tel = $('scr-' + top); if(tel){ tel.classList.remove('behind'); }
    if(REFRESH[top] && R[top]){ safe(function(){ R[top](lastParam[top], true); }); }
  }
  lockNav();
  safe(updateBadges);
}
function goHome(){
  while(stack.length){
    var id = stack.pop();
    var el = $('scr-' + id);
    if(el){ el.classList.remove('active', 'behind'); }
    leave(id);
  }
  navLock = false; clearTimeout(navTimer);
  safe(updateBadges);
}
function leave(id){
  if(id === 'call'){ S.call.on = false; }
  if(id === 'vplayer'){ S.video.playing = false; }
}
function nudgeHome(){ var h = $('home'); if(!h){ return; } h.classList.remove('nudge'); void h.offsetWidth; h.classList.add('nudge'); }
function unlock(){ var l = $('lock'); if(l){ l.classList.add('hidden'); } }

function marsNow(){
  var jdUT = Date.now() / 86400000 + 2440587.5;
  var jdTT = jdUT + 69.184 / 86400;
  var msd = (jdTT - 2405522.0028779) / 1.0274912517;
  var frac = msd - Math.floor(msd);
  var hrs = frac * 24, h = Math.floor(hrs), mf = (hrs - h) * 60, m = Math.floor(mf), s = Math.floor((mf - m) * 60);
  return {sol:Math.floor(msd), h:h, m:m, s:s};
}
function nowHM(){ var mr = marsNow(); return pad2(mr.h) + ':' + pad2(mr.m); }
function setHands(p, h, m, s){
  var H = $(p + 'H'), M = $(p + 'M'), Sx = $(p + 'S');
  if(H){ H.setAttribute('transform', 'rotate(' + ((h % 12) * 30 + m * 0.5).toFixed(2) + ' 50 50)'); }
  if(M){ M.setAttribute('transform', 'rotate(' + (m * 6 + s * 0.1).toFixed(2) + ' 50 50)'); }
  if(Sx){ Sx.setAttribute('transform', 'rotate(' + (s * 6) + ' 50 50)'); }
}
function tick(){
  var d = new Date(), mr = marsNow();
  var vals = {
    'mars-hm': pad2(mr.h) + ':' + pad2(mr.m),
    'earth-hm': pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()),
    'sol': 'SOL ' + mr.sol
  };
  var els = document.querySelectorAll('[data-clk]');
  for(var i = 0; i < els.length; i++){
    var v = vals[els[i].getAttribute('data-clk')];
    if(v != null && els[i].textContent !== v){ els[i].textContent = v; }
  }
  setHands('we', d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds());
  setHands('wm', mr.h, mr.m, mr.s);
  setHands('ic', mr.h, mr.m, mr.s);
}

function onClick(e){
  var t = e.target;
  if(t && typeof t.closest !== 'function'){ t = t.parentElement; }
  if(!t || typeof t.closest !== 'function'){ return; }
  var el = t.closest('[data-action]');
  if(!el){ return; }
  var fn = A[el.getAttribute('data-action')];
  if(typeof fn !== 'function'){ return; }
  safe(function(){ fn(el, e); });
}
function onKey(e){
  if(e.isComposing || e.keyCode === 229){ return; }
  var t = e.target, id = t && t.id;
  if(e.key === 'Enter'){
    if(id === 'chatInput'){ e.preventDefault(); safe(A.send); }
    else if(id === 'webInput'){ e.preventDefault(); safe(A.webSearch); }
    else if(id === 'shopInput'){ e.preventDefault(); safe(A.shopSearch); }
    else if(id === 'msgSearch'){ e.preventDefault(); if(t.blur){ t.blur(); } }
    else if(isLocked()){ unlock(); }
  } else if(e.key === 'Escape'){
    if(!isLocked()){ goBack(); }
  }
}
function onInput(e){
  var t = e.target;
  if(t && t.id === 'msgSearch'){ S.msgQ = t.value; applyMsgFilter(); }
}
function onScroll(e){
  var t = e.target;
  if(!t || !t.classList || !t.classList.contains('body')){ return; }
  var nb = t.parentElement ? t.parentElement.querySelector('.nb') : null; if(!nb){ return; }
  nb.classList.toggle('solid', t.scrollTop > 4);
  nb.classList.toggle('tshow', t.scrollTop > 40);
}
var tStart = null;
function onTouchStart(e){
  if(!e.touches || e.touches.length !== 1){ tStart = null; return; }
  var p = $('phone'), r = p.getBoundingClientRect(), t = e.touches[0];
  tStart = {x:t.clientX, y:t.clientY, rx:t.clientX - r.left, ry:t.clientY - r.top, h:r.height, target:e.target, time:Date.now()};
}
function onTouchEnd(e){
  if(!tStart || !e.changedTouches || !e.changedTouches.length){ tStart = null; return; }
  var s = tStart, t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
  tStart = null;
  if(Date.now() - s.time > 900){ return; }
  if(isLocked()){ if(dy < -70 && Math.abs(dx) < 100){ unlock(); } return; }
  if(s.ry > s.h - 56 && dy < -60 && Math.abs(dx) < 110){ if(stack.length){ goHome(); } return; }
  if(s.rx < 24 && dx > 70 && Math.abs(dy) < 70){ goBack(); return; }
  var pv = s.target && s.target.closest ? s.target.closest('.pvf') : null;
  if(pv && Math.abs(dx) > 50 && Math.abs(dy) < 60){ photoStep(dx < 0 ? 1 : -1); }
}

/* ================= 초기화 ================= */
function init(){
  safe(buildHome);
  document.addEventListener('click', onClick, false);
  document.addEventListener('keydown', onKey, false);
  document.addEventListener('input', onInput, false);
  document.addEventListener('scroll', onScroll, true);
  document.addEventListener('touchstart', onTouchStart, {passive:true});
  document.addEventListener('touchend', onTouchEnd, {passive:true});
  safe(tick);
  safe(updateBadges);
  safe(renderMini);
  setInterval(function(){ safe(tick); safe(musicTick); safe(videoTick); safe(callTick); }, 1000);
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }

})();
